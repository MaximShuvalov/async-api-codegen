plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

dependencies {
    implementation project(':asyncapi-generator-core')
    testImplementation gradleTestKit()
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
    plugins {
        asyncApiSpring {
            id = 'ru.mshuvalov.asyncapi.codegen'
            implementationClass = 'ru.mshuvalov.asyncapi.gradle.AsyncApiSpringPlugin'
            displayName = 'AsyncAPI Spring code generator'
            description = 'Generates Spring messaging code from AsyncAPI documents.'
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }
