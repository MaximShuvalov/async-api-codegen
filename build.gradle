plugins {
    id 'base'
}

allprojects {
    group = 'ru.mshuvalov.asyncapi'
    version = providers.gradleProperty('version').getOrElse('0.2.0-SNAPSHOT')

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

subprojects {
    plugins.withId('maven-publish') {
        def gitlabMavenRepositoryUrl = providers.gradleProperty('gitlabMavenRepositoryUrl')

        if (gitlabMavenRepositoryUrl.isPresent()) {
            publishing {
                repositories {
                    maven {
                        name = 'GitLab'
                        url = uri(gitlabMavenRepositoryUrl.get())
                        credentials {
                            username = providers.gradleProperty('gitlabMavenUsername').getOrElse('gitlab-ci-token')
                            password = providers.gradleProperty('gitlabMavenToken').getOrElse('')
                        }
                    }
                }
            }
        }
    }
}
