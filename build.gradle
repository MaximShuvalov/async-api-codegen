import org.gradle.api.credentials.HttpHeaderCredentials
import org.gradle.authentication.http.HttpHeaderAuthentication

plugins {
    id 'base'
}

allprojects {
    group = providers.gradleProperty('group').get()
    version = providers.gradleProperty('version').get()

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

subprojects {
    plugins.withId('maven-publish') {
        def gitlabMavenRepositoryUrl = providers.gradleProperty('gitlabMavenRepositoryUrl').orNull
        def ciJobToken = providers.environmentVariable('CI_JOB_TOKEN').orNull
        def token = providers.gradleProperty('gitlabMavenToken').orNull
            ?: ciJobToken
            ?: providers.environmentVariable('GITLAB_TOKEN').orNull
        def headerName = providers.gradleProperty('gitlabMavenHeaderName').orNull
            ?: (ciJobToken ? 'Job-Token' : 'Private-Token')

        if (gitlabMavenRepositoryUrl && token) {
            publishing {
                repositories {
                    maven {
                        name = 'GitLab'
                        url = uri(gitlabMavenRepositoryUrl)
                        credentials(HttpHeaderCredentials) {
                            name = headerName
                            value = token
                        }
                        authentication {
                            header(HttpHeaderAuthentication)
                        }
                    }
                }
            }
        }
    }
}
