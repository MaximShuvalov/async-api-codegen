image: gradle:9.3.0-jdk21

stages:
  - verify
  - publish

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

cache:
  key: "gradle-$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/caches
    - .gradle/notifications
    - .gradle/wrapper

verify:
  stage: verify
  script:
    - ./gradlew --no-daemon check
  rules:
    - when: manual

publish:
  stage: publish
  needs:
    - verify
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        ./gradlew --no-daemon publish \
          -Pversion="${CI_COMMIT_TAG#v}" \
          -PgitlabMavenRepositoryUrl="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/maven"
      else
        ./gradlew --no-daemon publish \
          -PgitlabMavenRepositoryUrl="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/maven"
      fi
  rules:
    - when: manual
